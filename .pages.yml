media:
  input: "static/images"
  output: "/images"

content:
  - name: "posts"
    label: "博客文章"
    type: "collection"
    path: "content/post"
    create: true
    delete: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布日期
        type: date
      - name: draft
        label: 是否草稿
        type: boolean
        default: false
      - name: description
        label: 摘要
        type: string
      - name: tags
        label: 标签
        type: string     # 注意这里改成了 string
        list: true       # 加上 list: true，它就会变成一个可以点“+”号添加多项的输入框
      - name: categories
        label: 分类
        type: string
        list: true       # 顺手把分类也加上，Stack 主题支持分类
      - name: body
        label: 正文
        type: markdown